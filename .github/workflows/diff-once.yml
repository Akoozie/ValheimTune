name: diff-once
on:
  push:
    branches: [port-1.0.21]
    paths: [".github/workflows/diff-once.yml"]
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    env:
      DOTNET_ROLL_FORWARD: Major
      MANAGED: ${{ runner.temp }}/server/valheim_server_Data/Managed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/server/valheim_server_Data/Managed
          key: server-public-25909431
          fail-on-cache-miss: true
      - run: mv "$RUNNER_TEMP/server/valheim_server_Data/Managed" "$RUNNER_TEMP/old"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/server/valheim_server_Data/Managed
          key: server-public-26266951
          fail-on-cache-miss: true
      - run: mv "$RUNNER_TEMP/server/valheim_server_Data/Managed" "$RUNNER_TEMP/new"
      - name: Decompile and diff
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/tools" ilspycmd >/dev/null
          types="Version $(python3 -c "import importlib.util as u; s=u.spec_from_file_location('p','ci/patched-methods.py'); m=u.module_from_spec(s); s.loader.exec_module(m); print(' '.join(sorted({t for t,_ in m.targets()})))")"
          for side in old new; do
            mkdir -p "$RUNNER_TEMP/src-$side"
            for t in $types; do
              "$RUNNER_TEMP/tools/ilspycmd" -t "$t" -r "$RUNNER_TEMP/$side" "$RUNNER_TEMP/$side/assembly_valheim.dll" > "$RUNNER_TEMP/src-$side/$t.cs"
            done
            python3 ci/patched-methods.py "$RUNNER_TEMP/src-$side" "$RUNNER_TEMP/patched-$side"
          done
          echo "::group::patched-method diff 1.0.20 -> 1.0.21"
          diff -ru "$RUNNER_TEMP/patched-old" "$RUNNER_TEMP/patched-new" && echo "ALL PATCHED METHODS IDENTICAL"
          echo "::endgroup::"
          echo "::group::whole patched types diff stat"
          diff -rq "$RUNNER_TEMP/src-old" "$RUNNER_TEMP/src-new" || true
          echo "::endgroup::"
          echo "::group::whole patched types diff"
          diff -ru "$RUNNER_TEMP/src-old" "$RUNNER_TEMP/src-new" | head -1500 || true
          echo "::endgroup::"

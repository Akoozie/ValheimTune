name: docs
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"   # daily: catches a new Valheim patch before anyone reports it
  workflow_dispatch:
jobs:
  staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash check-docs.sh ${{ github.event_name != 'push' && github.event_name != 'pull_request' && '--steam' || '' }}
